# PostgreSQL + pgvector — 코드 인덱스(심볼, 호출 엣지, 임베딩) 저장용.
# 주의: 이 프로토타입의 분석 결과는 메모리 캐시에 있고, 아래 DB는 아직 서버에 연결되어 있지 않다.
# 포트는 127.0.0.1에만 바인딩한다.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: recat
      POSTGRES_PASSWORD: ${RECAT_DB_PASSWORD:-recat-dev-only}
      POSTGRES_DB: recat
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./store/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - recat_pg:/var/lib/postgresql/data
volumes:
  recat_pg:
